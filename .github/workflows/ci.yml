name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # No `--ignore-scripts` here: `prepare` was dropped, so `npm ci` no longer
      # builds this package on its own — building is the explicit step below.
      # Skipping scripts would also skip the dependency postinstalls that
      # esbuild/rolldown rely on to materialise their platform binaries.
      - run: npm ci

      # The host and browser halves are separate TypeScript projects. The build
      # is explicit because `prepare` was dropped — the compiled `lib/` is
      # committed so that a git-hosted install needs no build at all.
      - run: npm run build

      - run: npm run typecheck

      - run: npm test
