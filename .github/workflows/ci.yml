name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # `--ignore-scripts` keeps the install reproducible: the package no longer
      # builds on install (see the build step below), which is what lets a
      # `github:` install through pnpm succeed without an allowBuilds entry.
      - run: npm ci --ignore-scripts

      # The host and browser halves are separate TypeScript projects. The build
      # is explicit because `prepare` was dropped — the compiled `lib/` is
      # committed so that a git-hosted install needs no build at all.
      - run: npm run build

      - run: npm run typecheck

      - run: npm test
